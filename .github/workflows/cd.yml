name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy when CI succeeded on master (or when triggered manually).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: ${{ steps.provision.outputs.webAppUrl }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish PhotoIt.Web/PhotoIt.Web.csproj --configuration Release --output ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Creates or updates the App Service, App Insights and storage role assignment (idempotent).
      - name: Provision infrastructure
        id: provision
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE__CLIENT_SECRET }}
          VISIONENGINE_CLIENT_SECRET: ${{ secrets.VISIONENGINE__CLIENTSECRET }}
          VISIONENGINE_BASE_URL: ${{ secrets.VISIONENGINE__BASEURL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE__CLIENT_ID }}
          VISIONENGINE_SCOPE: ${{ vars.VISIONENGINE__SCOPE }}
          VISIONENGINE_TENANT_ID: ${{ vars.VISIONENGINE__TENANTID }}
          VISIONENGINE_CLIENT_ID: ${{ vars.VISIONENGINE__CLIENTID }}
        run: |
          outputs=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              googleClientId="$GOOGLE_CLIENT_ID" \
              googleClientSecret="$GOOGLE_CLIENT_SECRET" \
              visionEngineBaseUrl="$VISIONENGINE_BASE_URL" \
              visionEngineScope="$VISIONENGINE_SCOPE" \
              visionEngineTenantId="$VISIONENGINE_TENANT_ID" \
              visionEngineClientId="$VISIONENGINE_CLIENT_ID" \
              visionEngineClientSecret="$VISIONENGINE_CLIENT_SECRET" \
            --query properties.outputs -o json)
          echo "webAppName=$(echo "$outputs" | jq -r .webAppName.value)" >> "$GITHUB_OUTPUT"
          echo "webAppUrl=$(echo "$outputs" | jq -r .webAppUrl.value)" >> "$GITHUB_OUTPUT"

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.provision.outputs.webAppName }}
          package: ./publish

      - name: Smoke test
        run: |
          url="${{ steps.provision.outputs.webAppUrl }}/health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Health check failed for $url"
          exit 1
