name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PhotoIt.slnx --runtime win-x64

      - name: Build
        run: dotnet build PhotoIt.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PhotoIt.slnx --configuration Release --no-build
